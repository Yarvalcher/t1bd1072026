version: 1
applications:
  - appRoot: ai-recipe-generator
    backend:
      phases:
        build:
          commands:
            - npm install --force
            - npx amplify deploy --yes
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*