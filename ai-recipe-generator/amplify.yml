version: 1
backend:
  phases:
    build:
      commands:
        - npm install --force
        - npx amplify-backend deploy
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*